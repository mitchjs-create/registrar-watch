name: Discover booking flows

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site key to inspect, or 'all'"
        required: true
        default: "all"
      mode:
        description: "explore, capture, or notify-test"
        required: true
        default: "explore"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run discovery
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TH_FIRST_NAME: ${{ secrets.TH_FIRST_NAME }}
          TH_LAST_NAME: ${{ secrets.TH_LAST_NAME }}
          TH_EMAIL: ${{ secrets.TH_EMAIL }}
          TH_MOBILE: ${{ secrets.TH_MOBILE }}
        run: |
          SITE_ARG=""
          if [[ "${{ inputs.site }}" != "all" ]]; then SITE_ARG="--site=${{ inputs.site }}"; fi
          if [[ "${{ inputs.mode }}" == "notify-test" ]]; then
            node check.js --test-notify 2>&1 | tee debug-summary.txt
          elif [[ "${{ inputs.mode }}" == "explore" ]]; then
            node explore.js $SITE_ARG 2>&1 | tee debug-summary.txt
          else
            node check.js --dry-run $SITE_ARG 2>&1 | tee debug-summary.txt
          fi
        continue-on-error: true

      - name: Commit findings
        run: |
          mkdir -p debug 2>/dev/null || true
          mv -f debug-summary.txt debug/ 2>/dev/null || true
          git config user.name "registrar-watch"
          git config user.email "actions@users.noreply.github.com"
          git fetch -q origin main
          git reset -q --soft origin/main
          git add -A debug state.json 2>/dev/null || true
          if [[ -n "$(git diff --cached --name-only)" ]]; then
            git commit -qm "Run output $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push -q origin HEAD:main
            echo "committed"
          else
            echo "nothing to commit"
          fi
