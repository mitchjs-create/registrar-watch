name: Check registrar availability

on:
  schedule:
    # Every 5 minutes, 05:00 to 21:59 UTC. Cron has no timezone, so during
    # British Summer Time that is 06:00 to 22:59 local, and after the clocks go
    # back on 25 October it is 05:00 to 21:59 local. Five minutes is the finest
    # granularity GitHub allows and scheduled runs are often queued late.
    - cron: "*/5 5-21 * * *"
  workflow_dispatch:

concurrency:
  group: registrar-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TH_FIRST_NAME: ${{ secrets.TH_FIRST_NAME }}
          TH_LAST_NAME: ${{ secrets.TH_LAST_NAME }}
          TH_EMAIL: ${{ secrets.TH_EMAIL }}
          TH_MOBILE: ${{ secrets.TH_MOBILE }}
        run: node check.js

      - name: Save state
        run: |
          mkdir -p debug 2>/dev/null || true
          mv -f debug-summary.txt debug/ 2>/dev/null || true
          git config user.name "registrar-watch"
          git config user.email "actions@users.noreply.github.com"
          git fetch -q origin main
          git reset -q --soft origin/main
          git add -A state.json 2>/dev/null || true
          if [[ -n "$(git diff --cached --name-only)" ]]; then
            git commit -qm "Run output $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push -q origin HEAD:main
            echo "committed"
          else
            echo "nothing to commit"
          fi
