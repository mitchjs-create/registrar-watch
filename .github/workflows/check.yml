name: Check registrar availability

on:
  schedule:
    # Every 15 minutes. GitHub queues scheduled jobs, so in practice expect
    # anything from on time to about 10 minutes late.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: registrar-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: node check.js

      - name: Save state
        run: |
          mkdir -p debug 2>/dev/null || true
          mv -f debug-summary.txt debug/ 2>/dev/null || true
          git config user.name "registrar-watch"
          git config user.email "actions@users.noreply.github.com"
          git fetch -q origin main
          git reset -q --soft origin/main
          git add -A state.json 2>/dev/null || true
          if [[ -n "$(git diff --cached --name-only)" ]]; then
            git commit -qm "Run output $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push -q origin HEAD:main
            echo "committed"
          else
            echo "nothing to commit"
          fi
