name: Check registrar availability

on:
  # GitHub throttles cron heavily, so this is only a safety net that restarts
  # the watcher if it dies. The real cadence comes from the loop inside the job.
  # Every four hours rather than hourly, because a restart cancels the running
  # watcher and costs a couple of minutes reinstalling the browser.
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

# A newer run replaces an older one, so there is only ever one watcher alive.
concurrency:
  group: registrar-watch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TH_FIRST_NAME: ${{ secrets.TH_FIRST_NAME }}
          TH_LAST_NAME: ${{ secrets.TH_LAST_NAME }}
          TH_EMAIL: ${{ secrets.TH_EMAIL }}
          TH_MOBILE: ${{ secrets.TH_MOBILE }}
        run: |
          git config user.name "registrar-watch"
          git config user.email "actions@users.noreply.github.com"
          END=$((SECONDS + 19800))   # five and a half hours
          while [ $SECONDS -lt $END ]; do
            HOUR=$(date -u +%H)
            if [ "$((10#$HOUR))" -ge 5 ] && [ "$((10#$HOUR))" -le 21 ]; then
              echo "=== sweep at $(date -u '+%H:%M UTC') ==="
              node check.js || echo "sweep failed, carrying on"
              if [[ -n "$(git status --porcelain state.json)" ]]; then
                git fetch -q origin main
                git reset -q --soft origin/main
                git add state.json
                git commit -qm "State $(date -u '+%Y-%m-%d %H:%M UTC')"
                git push -q origin HEAD:main || echo "push failed, will retry next sweep"
              fi
            else
              echo "outside watching hours, idling"
            fi
            sleep 240
          done
